function runComprehension(comps,onDone){
  let i=0,ok=0;
  const next=()=>{
    if(i>=comps.length){
      const ratio=ok/comps.length;
      if(ratio<0.8)S.analytics.wpmMax=Math.max(200,S.analytics.wpmMax-25);
      else S.analytics.wpmMax=Math.min(600,S.analytics.wpmMax+25);
      checkQuests('questions',comps.length);persist();
      toast(`Понимание: ${Math.round(ratio*100)}%. Новая целевая скорость: ${S.analytics.wpmMax} WPM`,'fa-gauge-high');
      onDone&&onDone();return;
    }
    const[q,...opts]=comps[i];
    openModal(`<h3 class="font-bold mb-3">Вопрос ${i+1}/${comps.length}</h3><p class="text-lg mb-3">${esc(q)}</p><div class="flex flex-col gap-2" id="cOpts"></div>`,{closable:false,label:'Понимание'});
    shuffle(opts).forEach(o=>{
      const b=el('button','btn text-left',esc(o));
      b.addEventListener('click',()=>{if(o===opts[0])ok++;i++;closeModal();setTimeout(next,200);});
      $('cOpts').appendChild(b);
    });
  };
  next();
}

let convoMood='neutral';
function renderDialogue(c){

  const moodRow=el('div','flex gap-2 mb-4 items-center');
  moodRow.appendChild(el('span','text-sm','Настроение NPC:'));
  [['friendly','Дружелюбное'],['neutral','Нейтральное'],['irritated','Раздражённое']].forEach(([v,l])=>{
    const b=el('button','btn'+(convoMood===v?' btn-primary':''),l);

    <div class="text-xs" style="color:var(--muted)">${sc.turns.length} ходов · NPC: ${esc(sc.npc)} · ${convoMood}</div>`;
    d.addEventListener('click',()=>startScenario(sc));
    grid.appendChild(d);
  });
  c.appendChild(grid);
}
function startScenario(sc){
  let turn=0,score=0,good=0,bad=0;
  const log=[];
  const moodAdj={friendly:{pitch:sc.pitch+0.1,rate:sc.rate},neutral:{pitch:sc.pitch,rate:sc.rate},irritated:{pitch:sc.pitch-0.15,rate:sc.rate+0.1}}[convoMood];
  function renderTurn(){
    if(turn>=sc.turns.length){finish();return;}
    const t=sc.turns[turn];
    openModal(`<h3 class="font-bold mb-1">${esc(sc.title)} · ход ${turn+1}/${sc.turns.length}</h3>
    <div id="scLog" class="space-y-2 mb-3 max-h-64 overflow-y-auto"></div>
    <div id="scOpts" class="space-y-2"></div>`,{closable:false,label:'Диалог'});
    const logBox=$('scLog');
    const push=(txt,cls)=>{const m=el('div','dialogue-msg '+cls,esc(txt));logBox.appendChild(m);logBox.scrollTop=1e6;log.push({txt,cls});};
    push(sc.npc+': '+t.npc,'npc-msg');
    speak(t.npc,{rate:moodAdj.rate,boundaryCb:null});
    t.opts.forEach(o=>{
      const b=el('button','btn text-left flex items-center gap-2',
        `<span class="text-xs px-1.5 rounded" style="background:rgba(250,204,21,.15);color:#facc15" title="вежливость">${'★'.repeat(o.p)}</span> ${esc(o.t)}`);
      const mic=`<button class="btn btn-ghost ml-auto" aria-label="Сказать вслух"><i class="fa-solid fa-microphone"></i></button>`;
      b.addEventListener('click',()=>{
        // Прагматика: прямая реплика (вежливость 1) с раздражённым NPC — штраф
        let q=o.q;
        if(convoMood==='irritated'&&o.p<=2)q=2;
        if(convoMood==='friendly'&&o.p>=5&&q>0)q=Math.max(0,q-1);
        push(o.t,'user-msg');score+=q===0?2:q===1?1:0;
        if(q===0)good++;if(q===2)bad++;
        setTimeout(()=>{push(sc.npc+': '+o.r,'npc-msg');speak(o.r,{rate:moodAdj.rate});},500);
        turn++;
        setTimeout(renderTurn,2200);
        $('scOpts').remove();
      });
      $('scOpts').appendChild(b);
    });
    // Голосовой ввод выбора (транспозиция речи в текст, поиск ближайшей опции)
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){
      const micB=el('button','btn w-full','<i class="fa-solid fa-microphone mr-1"></i>Сказать свой вариант вслух');
      micB.addEventListener('click',()=>{
        const r=new SR();r.lang='en-US';r.interimResults=false;
        r.onresult=e=>{
          const said=e.results[0][0].transcript;
          push(said,'user-msg');
          const best=t.opts.map(o=>({o,d:levenshteinWords(said,o.t)})).sort((a,b)=>a.d-b.d)[0];
          score+=best.d<=3?(best.o.q===0?2:best.o.q===1?1:0):0;
          setTimeout(()=>{push(sc.npc+': '+best.o.r,'npc-msg');speak(best.o.r);},400);
          turn++;setTimeout(renderTurn,2200);$('scOpts').remove();
        };
        r.onerror=()=>toast('Микрофон не распознал речь','fa-microphone-slash','#ef4444');
        r.start();toast('Говорите…','fa-microphone');
      });
      $('scOpts').appendChild(micB);
    }
  }
  function finish(){
    S.analytics.convosDone=(S.analytics.convosDone||0)+1;
    checkQuests('convo',1);recordDrillResult(bad===0,0);checkBadges();
    const ending=bad===0?(good>=3?'отличная':'хорошая'):'требует работы';
    const xp=score*8;
    openModal(`<h3 class="text-lg font-bold mb-2"><i class="fa-solid fa-clipboard-check mr-2" style="color:#22c55e"></i>Ведомость диалога: ${esc(sc.title)}</h3>
    <ul class="text-sm space-y-1 mb-3">
    <li>Удачных реплик: <b style="color:#22c55e">${good}</b> · нейтральных: ${sc.turns.length-good-bad} · неудачных: <b style="color:#ef4444">${bad}</b></li>
    <li>Ветка: <b>${ending}</b> · настроение NPC: ${convoMood}</li>
    <li>Награда: <b>+${xp} XP</b></li></ul>
    <p class="text-xs mb-3" style="color:var(--muted)">Пройдите сценарий с другим настроением NPC — та же лексика требует разной прагматики.</p>
    <button class="btn btn-primary" id="scEnd">Завершить</button>`,{closable:false,label:'Итог'});
    awardXP(xp,'диалог завершён');
    $('scEnd').addEventListener('click',closeModal);
  }
  renderTurn();
}

/*
=====================================================================
БЛОК 28: ДВИЖОК ГИПЕРФОКУСА + ВОЛНА ПОТОКА.
Шроуд-оверлей прячет навигацию и статистику — экстремальное
снижение внешних отвлечений. Активность студента замеряется каждые
5 сек; пауза 60с — «Вы ещё здесь?». Esc — срыв фокуса без XP
(жёсткий контракт). Полные 10/25/50 минут — случайная выплата
100–300 XP × множитель. ЭЭГ-волна усиливается при регулярном
ритме ответов: метрика = 1 − дисперсия интервалов активности.
=====================================================================
*/
let focusState={running:false,interval:null,lastActivity:Date.now(),events:[],raf:null};
function startActivityTracked(){focusState.lastActivity=Date.now();if(focusState.running)focusState.events.push(Date.now());}
['click','keydown'].forEach(ev=>document.addEventListener(ev,startActivityTracked,{passive:true}));
function startFocus(presetKey){
  const preset=FOCUS_PRESETS[presetKey];
  focusState={running:true,interval:null,lastActivity:Date.now(),events:[],raf:null};
  const totalMs=preset.min*60000;const endAt=Date.now()+totalMs;
  const shroud=el('div');
  shroud.style.cssText='position:fixed;inset:0;z-index:105;background:rgba(2,2,4,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px';
  shroud.innerHTML=`
    <div class="text-xs tracking-[.3em] uppercase" style="color:#6366f1">Hyper-Focus Flow · ${preset.min} мин · x${preset.mult}</div>
    <div id="focusClock" class="text-6xl font-extrabold mono neon-text" style="color:#818cf8">${preset.min}:00</div>
    <canvas id="flowCv" width="300" height="70" style="opacity:.8"></canvas>
    <div id="focusMsg" class="text-sm h-6" style="color:var(--muted)"></div>
    <button class="btn" id="focusExit" style="border-color:#ef4444"><i class="fa-solid fa-door-open mr-1"></i>Выйти (срыв фокуса — без XP)</button>`;
  document.body.appendChild(shroud);
  const tick=()=>{
    const left=endAt-Date.now();
    if(left<=0){finishFocus(true,preset);return;}
    const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    $('focusClock').textContent=`${m}:${String(s).padStart(2,'0')}`;
    if(Date.now()-focusState.lastActivity>IDLE_PROMPT_MS){
      $('focusMsg').innerHTML='Вы ещё здесь? Кликните в любом месте, чтобы подтвердить активность.';
    }
  };
  focusState.interval=setInterval(tick,1000);tick();
  drawFlow();
  $('focusExit').addEventListener('click',()=>finishFocus(false,preset));
  const escHandler=e=>{if(e.key==='Escape')finishFocus(false,preset);};
  document.addEventListener('keydown',escHandler,{once:true});
  function drawFlow(){
    if(!focusState.running)return;
    const cv=$('flowCv');if(!cv)return;
    const ctx=cv.getContext('2d');
    // Амплитуда потока: регулярность последних интервалов активности
    const ev=focusState.events.slice(-20);
    let amp=0.15;
    if(ev.length>=4){
      const gaps=[];for(let i=1;i<ev.length;i++)gaps.push(ev[i]-ev[i-1]);
      const avg=gaps.reduce((a,b)=>a+b,0)/gaps.length;
      const varc=gaps.reduce((a,g)=>a+(g-avg)*(g-avg),0)/gaps.length;
      amp=clamp(1-Math.sqrt(varc)/(avg+1),0.15,1);
    }
    ctx.clearRect(0,0,300,70);
    ctx.strokeStyle='#6366f1';ctx.lineWidth=1.5;ctx.beginPath();
    const t=Date.now()/90;
    for(let x=0;x<300;x++){
      const y=35+Math.sin(x/9+t)*22*amp+Math.sin(x/3+t*2.7)*7*amp;
      x?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
    focusState.raf=requestAnimationFrame(drawFlow);
  }
  function finishFocus(completed,p){
    focusState.running=false;
    clearInterval(focusState.interval);cancelAnimationFrame(focusState.raf);
    shroud.remove();document.removeEventListener('keydown',escHandler);
    if(completed){
      const xp=Math.floor((FOCUS_XP_RANGE[0]+Math.random()*(FOCUS_XP_RANGE[1]-FOCUS_XP_RANGE[0]))*p.mult);
      S.analytics.focusCompletions++;checkQuests('focus',1);checkBadges();
      openModal(`<h3 class="text-xl font-bold mb-2" style="color:#22c55e"><i class="fa-solid fa-brain mr-2"></i>Фокус завершён!</h3>
      <p class="text-sm mb-3">${p.min} минут непрерывной глубокой работы. Случайная выплата: <b>+${xp} XP</b> (множитель x${p.mult}).</p>
      <button class="btn btn-primary" id="fDone">Забрать</button>`,{closable:false,label:'Фокус'});
      awardXP(xp,'фокус-сессия');
      $('fDone').addEventListener('click',closeModal);
    }else{
      openModal(`<h3 class="text-lg font-bold mb-2" style="color:#ef4444"><i class="fa-solid fa-heart-cracked mr-2"></i>Фокус прерван</h3>
      <p class="text-sm mb-3">Срыв фокуса — без награды. Контракт с собой: попытка считается, только если доведена до конца.</p>

      $('fBrk').addEventListener('click',closeModal);
    }
  }
}

function buildLCS(a,b){
  const D=Array.from({length:a.length+1},()=>new Array(b.length+1).fill(0));
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    D[i][j]=a[i-1]===b[j-1]?D[i-1][j-1]+1:Math.max(D[i-1][j],D[i][j-1]);
  const res=[];let i=a.length,j=b.length;
  while(i>0&&j>0){if(a[i-1]===b[j-1]){res.push(a[i-1]);i--;j--;}else D[i-1][j]>=D[i][j-1]?i--:j--;}
  return res;
}
function renderWritingHints(box,text){
  box.innerHTML='';
  const low=text.toLowerCase();
  const hints=[];
  if(/i feel myself/.test(low))hints.push(['«I feel myself fine» — калька с русского. Правильно: «I feel fine» (без reflexive)','wordOrder']);
  if(/\b(i|you|he|she|we|they) (am|is|are) [a-z]+(er|ist|ian)\b/.test(low))hints.push(['Профессия после be требует артикля: «He is a teacher»','articles']);
  if(/i very like/.test(low))hints.push(['«I very like» — прямой порядок наречия из русского. Правильно: «I really like»','wordOrder']);
  if(/in the internet/.test(low))hints.push(['Правильно: «on the internet» (устойчивый предлог)','preposition']);
  if(/\bpeoples\b|\binformations\b|\badvices\b/.test(low))hints.push(['Неисчисляемые и собирательные не имеют -s: people, information, advice','plural']);
  if(!hints.length)hints.push(['Грубых русско-L1 паттернов не найдено. Отличная работа!','']);
  hints.forEach(([h,cat])=>{
    const d=el('div','card p-2 text-sm');
    d.innerHTML=`<i class="fa-solid fa-lightbulb mr-2" style="color:#facc15"></i>${esc(h)}${cat?` <span class="text-xs" style="color:var(--muted)">[категория: ${cat}]</span>`:''}`;
    box.appendChild(d);
    if(cat)S.errorPatterns[cat]=(S.errorPatterns[cat]||0)+0; // детекция не считается ошибкой — только сигнализирует
  });
}

function renderPalace(c){
  c.appendChild(el('h2','text-xl font-bold mb-2','<i class="fa-solid fa-warehouse mr-2" style="color:#22c55e"></i>Дворец памяти'));
  c.appendChild(el('p','text-sm mb-4','Перетащите слова на «мебель» — место станет крючком для вспоминания [Method of Loci]. 10 слов в комнате — и на прогулку.'));

    area.innerHTML='';

    room.slots.forEach((slot,i)=>{
      const s=el('div','palace-slot');

      area.appendChild(s);

    const trayWords=(known.length>=3?sample(known,8):['time','water','book','friend','work','night','money','food']);
    trayWords.forEach((w,i)=>{

      card.style.left=(4+i*12)+'%';card.style.top='86%';

    // DnD через pointer events
    let drag=null,startX=0,startY=0,origX=0,origY=0;
    area.querySelectorAll('.palace-card').forEach(card=>{
      card.addEventListener('pointerdown',e=>{
        drag=card;startX=e.clientX;startY=e.clientY;
        const r=card.getBoundingClientRect();origX=r.left;origY=r.top;
        card.setPointerCapture(e.pointerId);card.style.zIndex=20;
      });
      card.addEventListener('pointermove',e=>{
        if(drag!==card)return;
        const ar=area.getBoundingClientRect();
        const x=e.clientX-ar.left-30,y=e.clientY-ar.top-12;
        card.style.left=clamp(x,0,ar.width-70)+'px';card.style.top=clamp(y,0,ar.height-30)+'px';
        area.querySelectorAll('.palace-slot').forEach(s=>s.classList.remove('over'));
        const slot=nearestSlot(e);if(slot)slot.el.classList.add('over');
      });
      card.addEventListener('pointerup',e=>{
        if(drag!==card)return;
        const hit=nearestSlot(e);
        area.querySelectorAll('.palace-slot').forEach(s=>s.classList.remove('over'));
        if(hit){
          const ar=area.getBoundingClientRect();
          const slot=ROOMS[sel.value].slots[hit.i];
          card.style.left=(slot.x+1)+'%';card.style.top=(slot.y+7)+'%';
          S.analytics.palace[sel.value+'_'+hit.i]=card.dataset.word;
          checkQuests('palace',1);persist();
          toast(`«${card.dataset.word}» закреплено за «${slot.label}»`,'fa-map-pin','#22c55e');
        }
        drag=null;
      });
    });
    function nearestSlot(e){
      const ar=area.getBoundingClientRect();
      let best=null;
      ROOMS[sel.value].slots.forEach((slot,i)=>{
        const sx=ar.left+slot.x/100*ar.width,sy=ar.top+slot.y/100*ar.height;
        const d=Math.hypot(e.clientX-sx,e.clientY-sy);
        if(d<90&&(!best||d<best.d))best={i,d};
      });
      return best;
    }
  }
  sel.addEventListener('change',()=>{S.analytics.palaceRoom=sel.value;persist();drawRoom();});
  walkBtn.addEventListener('click',()=>{
    const filled=Object.entries(S.analytics.palace).filter(([k])=>k.startsWith(sel.value+'_'));

    скрыто — студент вспоминает его по МЕСТУ. Метод локусов использует
    пространственную память — древнейший контур мозга; абстрактная лексика
    получает дополнительные ассоциативные якоря [Method of Loci, Цицерон].
    */
    const items=filled.slice().sort((a,b)=>(+a[0].split('_')[1])-(+b[0].split('_')[1]));

      openModal(`<h3 class="font-bold mb-2">Прогулка: точка ${wi+1}/${items.length}</h3>
      <p class="text-lg mb-3">Вы у объекта <b>«${esc(slot.label)}»</b>. Какое слово здесь спрятано?</p>
      <button class="btn btn-primary" id="pwShow">Показать ответ</button>`,{closable:false,label:'Дворец памяти'});
      $('pwShow').addEventListener('click',()=>{
        openModal(`<h3 class="serif text-2xl mb-1">${esc(word)}</h3>
        <p class="text-sm mb-3">${esc(RUMAP[normWord(word)]||'—')} · у «${esc(slot.label)}»</p>
        <div class="flex gap-2"><button class="btn btn-primary" id="pwHit">Вспомнил</button><button class="btn" id="pwMiss">Не вспомнил</button></div>`,{closable:false,label:'Дворец памяти'});
        $('pwHit').addEventListener('click',()=>{wi++;recordDrillResult(true,measureAnswerTime());step();});
        $('pwMiss').addEventListener('click',()=>{wi++;recordDrillResult(false,measureAnswerTime());step();});

/*

повреждений БЕЗ правки гигантских упакованных строк:
1) записи БД, порванные ';' внутри значений, пересобираются из

   чтобы существующий поиск заметок в renderTokens заработал;

for(let i=PHRASALS.length-1;i>=0;i--)if(!PHRASALS[i].particle||!PHRASALS[i].ru||PHRASALS[i].base.trim()!==PHRASALS[i].base)PHRASALS.splice(i,1);
Object.keys(DICT).forEach(k=>{

    if(!DICT_RANK[lk])DICT_RANK[lk]=DICT_RANK[k];

});

/*
=====================================================================
SVG-ХЕЛПЕРЫ И СТАТИСТИКА. Все графики собраны вручную (Chart.js
запрещён монолитными ограничениями). Радар ошибок — мгновенный
портрет слабых мест: у русскоязычных обычно «вздуты» артикли.
Тепловая карта — визуальный стимул непрерывности привычки
(эффект GitHub-страйков усиливает серию [Skinner, 1957]).
=====================================================================
*/
function svgLine(data,color,w=520,h=90){
  const vals=(data||[]).filter(v=>typeof v==='number');
  if(vals.length<2)return '<p class="text-sm" style="color:var(--muted)">Недостаточно данных — график появится по мере занятий.</p>';
  const max=Math.max(...vals,1),min=Math.min(...vals,0);
  const pts=vals.map((v,i)=>[i/(vals.length-1)*(w-20)+10,h-8-((v-min)/((max-min)||1))*(h-24)]);
  const poly=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg viewBox="0 0 ${w} ${h}" class="w-full"><polyline points="${poly}" fill="none" stroke="${color}" stroke-width="2"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3.5" fill="${color}"/></svg>`;
}
function svgRadar(){
  const cats=[['articles','артикли'],['tense','времена'],['wordOrder','порядок слов'],['preposition','предлоги'],['plural','мн. число'],['phrasalVerb','фразовые'],['pronunciation','звуки']];
  const vals=cats.map(([k])=>S.errorPatterns[k]||0);
  const max=Math.max(...vals,1),cx=260,cy=130,R=95;
  const pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/cats.length;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r];};
  let svg='<svg viewBox="0 0 520 260" class="w-full">';
  [0.25,0.5,0.75,1].forEach(f=>{svg+=`<polygon points="${cats.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="#1f1f24"/>`;});
  cats.forEach(([k,l],i)=>{
    const[x,y]=pt(i,R);const[lx,ly]=pt(i,R+20);
    svg+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#1f1f24"/><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" fill="#8b8b96" font-size="10" font-family="Inter">${l}</text>`;
  });
  const poly=cats.map((_,i)=>pt(i,R*Math.max(vals[i]/max,0.03)).map(n=>n.toFixed(1)).join(',')).join(' ');
  svg+=`<polygon points="${poly}" fill="rgba(239,68,68,.25)" stroke="#ef4444" stroke-width="1.5"/></svg>`;
  return svg;
}
function svgBars(){
  const dc=S.analytics.drillCompletions;
  const rows=[['Клоуз',dc.cloze||0],['Реконстр.',dc.reconstruct||0],['Диктант',dc.dictation||0],['Письмо',dc.write||0]];
  const max=Math.max(...rows.map(r=>r[1]),1);
  let svg='<svg viewBox="0 0 520 140" class="w-full">';
  rows.forEach(([l,v],i)=>{
    const bw=90,bh=Math.max(4,v/max*100),x=30+i*125,y=120-bh;
    svg+=`<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${bh.toFixed(1)}" rx="5" fill="#6366f1"/><text x="${x+bw/2}" y="${(y-6).toFixed(1)}" text-anchor="middle" fill="#e4e4e9" font-size="12">${v}</text><text x="${x+bw/2}" y="136" text-anchor="middle" fill="#8b8b96" font-size="10" font-family="Inter">${l}</text>`;
  });
  return svg+'</svg>';
}

function renderSandbox(c){

  <button class="btn btn-primary mt-2" id="sbGo"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>Разобрать текст</button>`;
  c.appendChild(box);
  const out=el('div','card p-4');
  out.innerHTML='<p class="text-sm" style="color:var(--muted)">Здесь появится размеченный текст.</p>';
  c.appendChild(out);
  $('sbGo').addEventListener('click',()=>{
    const text=$('sbTa').value.trim();
    if(!text){toast('Вставьте текст для разбора','fa-input-text','#818cf8');return;}
    if(consolidationGate())return;
    out.innerHTML='';
    const{tokens,marks}=mergeChunks(tokenizeText(text));
    if(tokens.length>500){tokens.length=500;toast('Показаны первые 500 токенов — бюджет DOM','fa-scissors','#f59e0b');}
    const wrap=el('div','serif text-lg flex flex-wrap');
    wrap.style.lineHeight='2.3';
    renderTokens(wrap,tokens,marks,{textId:'sandbox'});
    out.appendChild(wrap);
    const counts={};
    tokens.forEach(t=>{if(!t.punct)counts[t.pos]=(counts[t.pos]||0)+1;});
    const hist=el('div','flex flex-wrap gap-2 mt-3 text-xs');
    Object.entries(counts).forEach(([k,v])=>{hist.appendChild(el('span','btn',(POS_RU[k]||k)+': <b>'+v+'</b>'));});
    out.appendChild(hist);
    const arts=(text.match(/\b(the|a|an)\b/gi)||[]).length;
    if(arts>=3&&S.errorPatterns.articles>=5){
      out.appendChild(el('p','text-xs mt-2','В тексте '+arts+' артиклей — ваша слабая зона. Разминка: вкладка «Тренажёры» → Article Sensei.'));
    }
    checkQuests('sandbox',1);recordDrillResult(true,measureAnswerTime());
  });
}

/*
=====================================================================
ANKI-ЭКСПОРТ. CSV — для полного набора полей; TSV (Front/Back) —
штатный прямой импорт Anki. Честное ограничение: бинарный .apkg
требует zip+SQLite (JSZip запрещён монолитными ограничениями),
поэтому .apkg заменён TSV — Anki импортирует его нативно.
=====================================================================
*/
function downloadBlob(content,name,type){
  const b=new Blob([content],{type});
  const u=URL.createObjectURL(b);
  const a=el('a');a.href=u;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}
function exportAnkiCSV(){
  if(!S.srs.deck.length){toast('Колода пуста — добавляйте слова через подсказки токенов','fa-inbox','#f59e0b');return;}
  const rows=[['word','translation','ipa','pos','example','ngsl_rank']];
  S.srs.deck.forEach(cd=>rows.push([cd.word,cd.ru,cd.ipa,cd.pos,cd.ex,DICT_RANK[normWord(cd.word)]||'']));
  const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  downloadBlob(csv,'neurolex-anki.csv','text/csv;charset=utf-8');
  toast('CSV готов — совместим с импортом Anki','fa-file-csv');
}
function exportAnkiTSV(){
  if(!S.srs.deck.length){toast('Колода пуста','fa-inbox','#f59e0b');return;}
  const lines=S.srs.deck.map(cd=>`${cd.word}\t${cd.ru||''}\t/${cd.ipa||''}/\t${cd.ex||''}`);
  downloadBlob('\uFEFF'+lines.join('\n'),'neurolex-anki-front-back.tsv','text/tab-separated-values;charset=utf-8');
  toast('TSV готов: прямой импорт в Anki (Front/Back)','fa-file-export');
}

=====================================================================
НАСТРОЙКИ, ФОКУС, СПРАВКА, ДОСТУПНОСТЬ. Все режимы доступности
(дальтоники, дислексия, высокий контраст, reduced motion) применяются
классами на body. Сброс прогресса — через кастомное подтверждение,
никаких confirm() [анти-паттерн №5].
=====================================================================
*/
function applySettings(){
  document.body.classList.toggle('colorblind',S.settings.colorBlindMode);
  document.body.classList.toggle('dyslexia',S.settings.dyslexiaMode);
  document.body.classList.toggle('highcontrast',S.settings.highContrastMode);
  document.body.classList.toggle('reduced-motion',S.settings.reducedMotion);
  document.body.classList.toggle('phonetic',S.settings.phoneticMode);
}
function openSettings(){
  openModal(`<h3 class="text-lg font-bold mb-3"><i class="fa-solid fa-gear mr-2" style="color:#818cf8"></i>Настройки</h3><div id="setRows" class="space-y-3"></div>
  <div class="mt-4 pt-3" style="border-top:1px solid var(--border)">
    <label class="text-xs block mb-1" style="color:var(--muted)">Голос синтеза (en)</label><select id="setVoice" class="btn w-full mb-3"></select>
    <label class="text-xs block mb-1" style="color:var(--muted)">Скорость речи: <span id="setSpeedVal">${S.settings.speed.toFixed(2)}x</span></label>
    <input type="range" id="setSpeed" min="0.6" max="1.2" step="0.05" value="${S.settings.speed}" class="w-full mb-3">
    <label class="text-xs block mb-1" style="color:var(--muted)">Дневная цель, минут: <span id="setGoalVal">${S.settings.dailyGoal}</span></label>
    <input type="range" id="setGoal" min="10" max="120" step="5" value="${S.settings.dailyGoal}" class="w-full">
  </div>
  <div class="flex gap-2 mt-4 flex-wrap"><button class="btn" id="setClose">Готово</button>
  <button class="btn" id="setExport" style="border-color:#eab308"><i class="fa-solid fa-file-csv mr-1"></i>CSV</button>
  <button class="btn" id="setTsv" style="border-color:#eab308"><i class="fa-solid fa-file-export mr-1"></i>TSV</button>
  <button class="btn ml-auto" id="setReset" style="border-color:#ef4444;color:#ef4444">Сброс прогресса</button></div>`,{label:'Настройки'});
  const rows=[['colorBlindMode','Дальтоники: стиль границы дублирует цвет (доступность)'],['dyslexiaMode','Дислексия: Verdana/OpenDyslexic, трекинг 0.08em, линейка'],['highContrastMode','Высокий контраст (усиленный контраст текста)'],['reducedMotion','Уменьшенное движение: без конфетти и анимаций']];
  rows.forEach(([key,label])=>{
    const row=el('div','flex items-center gap-3');
    row.innerHTML=`<span class="text-sm flex-1">${label}</span><div class="switch ${S.settings[key]?'on':''}" role="switch" aria-checked="${!!S.settings[key]}" tabindex="0"></div>`;
    const sw=row.querySelector('.switch');
    const flip=()=>{S.settings[key]=!S.settings[key];sw.classList.toggle('on',S.settings[key]);sw.setAttribute('aria-checked',String(S.settings[key]));applySettings();persist();};
    sw.addEventListener('click',flip);
    sw.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
    $('setRows').appendChild(row);
  });
  const vs=$('setVoice');
  voicesCache.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('en')).forEach(v=>{const o=el('option',null,v.name);o.value=v.name;vs.appendChild(o);});
  if(S.settings.voice)vs.value=S.settings.voice;
  vs.addEventListener('change',()=>{S.settings.voice=vs.value;persist();});
  $('setSpeed').addEventListener('input',e=>{S.settings.speed=+e.target.value;$('setSpeedVal').textContent=S.settings.speed.toFixed(2)+'x';persist();});
  $('setGoal').addEventListener('input',e=>{S.settings.dailyGoal=+e.target.value;$('setGoalVal').textContent=e.target.value;persist();});
  $('setClose').addEventListener('click',closeModal);
  $('setExport').addEventListener('click',exportAnkiCSV);
  $('setTsv').addEventListener('click',exportAnkiTSV);
  $('setReset').addEventListener('click',()=>{
    openModal(`<h3 class="font-bold mb-2" style="color:#ef4444">Сбросить весь прогресс?</h3>
    <p class="text-sm mb-3">Состояние в localStorage будет удалено безвозвратно: XP, колода, серия, дневник, ачивки.</p>
    <div class="flex gap-2"><button class="btn" id="rstNo">Отмена</button><button class="btn" id="rstYes" style="background:#ef4444;color:#fff;border:none">Сбросить</button></div>`,{label:'Подтверждение'});
    $('rstNo').addEventListener('click',closeModal);
    $('rstYes').addEventListener('click',()=>{localStorage.removeItem(LS_KEY);location.reload();});
  });
}
function openFocusPreset(){
  openModal(`<h3 class="font-bold mb-1"><i class="fa-solid fa-stopwatch mr-2" style="color:#818cf8"></i>Гиперфокус-поток</h3>
  <p class="text-sm mb-3" style="color:var(--muted)">Шроуд скрывает навигацию и статистику — экстремальное снижение отвлечений. Пауза 60с — «Вы ещё здесь?», Esc — срыв без награды. Завершение — случайная выплата 100–300 XP × множитель [Skinner, 1957].</p>
  <div id="fpList" class="space-y-2"></div>`,{label:'Фокус'});
  Object.entries(FOCUS_PRESETS).forEach(([key,p])=>{
    const b=el('button','btn w-full text-left',`<b>${p.min} минут</b> · множитель ×${p.mult}`);
    b.addEventListener('click',()=>{closeModal();startFocus(key);});
    $('fpList').appendChild(b);
  });
}
function openHelp(){
  openModal(`<h3 class="font-bold mb-2">Горячие клавиши</h3>
  <ul class="text-sm space-y-1">
  <li><b>1–9</b> — переключение вкладок</li>
  <li><b>Space</b> — озвучить токен в фокусе (или первый токен текста)</li>
  <li><b>Enter</b> — отправить ответ в клоз-поле</li>
  <li><b>← / →</b> — навигация по токенам</li>
  <li><b>Esc</b> — закрыть окно / сорвать фокус</li>
  <li><b>?</b> — эта справка</li></ul>
  <p class="text-xs mt-3" style="color:var(--muted)">Все токены доступны по Tab; скринридер объявляет слово, часть речи и перевод через aria-label.</p>`,{label:'Справка'});
}
function bindTopBar(){
  const bindSwitch=(id,key)=>{
    const s=$(id);
    const sync=()=>{s.classList.toggle('on',S.settings[key]);s.setAttribute('aria-checked',String(S.settings[key]));};
    sync();
    const flip=()=>{
      S.settings[key]=!S.settings[key];sync();applySettings();persist();
      if(key==='recallMode')renderTab(S.session.activeTab);
    };
    s.addEventListener('click',flip);
    s.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
  };
  bindSwitch('recallSwitch','recallMode');
  bindSwitch('phonSwitch','phoneticMode');
  $('settingsBtn').addEventListener('click',openSettings);
  $('focusBtn').addEventListener('click',openFocusPreset);
  $('panelToggle').addEventListener('click',()=>{$('rightPanel').classList.toggle('hidden');});
}
function bindKeys(){
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){closeModal();return;}
    const tag=(e.target.tagName||'').toLowerCase();
    if(tag==='input'||tag==='textarea'||tag==='select')return;
    if(e.key>='1'&&e.key<='9'){const t=TABS[+e.key-1];if(t)switchTab(t[0]);return;}
    if(e.key===' '){
      e.preventDefault();
      const f=document.activeElement;
      if(f&&f.classList&&f.classList.contains('tok'))speakWord(f.textContent.trim().split(/\s+/)[0]);
      else{const first=document.querySelector('#tabContent .tok');if(first)speakWord(first.textContent.trim().split(/\s+/)[0]);}
      return;
    }
    if(e.key==='?'){openHelp();return;}
    if(e.key==='ArrowRight'||e.key==='ArrowLeft'){
      const toks=[...document.querySelectorAll('#tabContent .tok')];
      const i=toks.indexOf(document.activeElement);
      if(i>=0){e.preventDefault();const n=toks[i+(e.key==='ArrowRight'?1:-1)];if(n)n.focus();}
    }
  });
}

/*
=====================================================================
ХЕДЕР, ПРАВАЯ ПАНЕЛЬ, УЧЁТ ВРЕМЕНИ, PWA, BOOT.
TrackTime раз в минуту: время учёбы, дневные минуты, логика серии
(продление, заморозка, сброс) — потоковое обновление без перезагрузки.
=====================================================================
*/
function updateHeader(){
  $('xpVal').textContent=S.progress.xp;
  $('streakVal').textContent=S.progress.streak;
  $('freezeVal').innerHTML=S.progress.streakFreezes>0?`<i class="fa-solid fa-snowflake" title="заморозки серии"></i> ${S.progress.streakFreezes}`:'';
  const pb=$('prestigeBadge');
  if(S.progress.prestige>0){pb.classList.remove('hidden');pb.textContent='P'+S.progress.prestige;}
  else pb.classList.add('hidden');
  updateCoverageUI();
}
function updateRightPanel(){
  const due=dueCards().length;
  const fc=coverageForecast();
  const leech=S.vocabulary.leeches.slice(0,5);
  const mins=S.analytics.dailyMinutes[todayKey()]||0;
  const goalPct=Math.min(100,Math.round(mins/S.settings.dailyGoal*100));
  $('rightPanelContent').innerHTML=`
  <div class="card p-3 mb-3"><div class="text-[11px] uppercase tracking-widest mb-1" style="color:var(--muted)">Цель дня</div>
  <div style="height:6px;background:var(--card2);border-radius:3px"><div style="height:6px;width:${goalPct}%;background:#22c55e;border-radius:3px"></div></div>
  <div class="text-xs mt-1" style="color:var(--muted)">${mins} / ${S.settings.dailyGoal} мин · серия ${S.progress.streak} дн.</div></div>
  <div class="card p-3 mb-3"><div class="text-[11px] uppercase tracking-widest mb-1" style="color:var(--muted)">SRS сейчас</div>
  <div class="text-sm">К повторению: <b style="color:#facc15">${due}</b> · в колоде: ${S.srs.deck.length}</div>
  ${leech.length?`<div class="text-xs mt-1" style="color:#f59e0b">Пиявки: ${leech.map(esc).join(', ')}</div>`:''}</div>
  <div class="card p-3 mb-3"><div class="text-[11px] uppercase tracking-widest mb-1" style="color:var(--muted)">Покрытие</div>
  <div class="text-sm">${S.vocabulary.coveragePercent}% текущего текста</div>
  ${fc?`<div class="text-xs mt-1" style="color:var(--muted)">Прогноз 95%: ~${fc.days} дн. (${fc.date})</div>`:''}</div>
  <div class="card p-3"><div class="text-[11px] uppercase tracking-widest mb-1" style="color:var(--muted)">Квесты дня</div>
  ${todaysQuests().map(q=>{const d=!!S.analytics['qdone_'+q.id+todayKey()];return`<div class="text-xs py-0.5"><i class="fa-solid ${d?'fa-check':'fa-circle'}" style="color:${d?'#22c55e':'#55555f'}"></i> ${esc(q.t)}</div>`;}).join('')}</div>`;
}
function trackTime(){
  setInterval(()=>{
    if(document.hidden)return;
    S.user.totalStudyTimeSec+=60;
    S.user.lastSessionAt=Date.now();
    const d=todayKey();
    S.analytics.dailyMinutes[d]=(S.analytics.dailyMinutes[d]||0)+1;
    const lastCov=S.analytics.coverageLog[S.analytics.coverageLog.length-1];
    if(!lastCov||lastCov.d!==d)S.analytics.coverageLog.push({d,pct:S.vocabulary.coveragePercent});
    if(S.progress.lastActiveDay!==d){
      const yest=new Date(Date.now()-86400000).toISOString().slice(0,10);
      if(!S.progress.lastActiveDay){/* первый запуск: сидовая серия сохраняется */}
      else if(S.progress.lastActiveDay===yest)S.progress.streak++;
      else if(S.progress.streakFreezes>0)S.progress.streakFreezes--;
      else S.progress.streak=1;
      S.progress.lastActiveDay=d;
      S.progress.longestStreak=Math.max(S.progress.longestStreak,S.progress.streak);
    }
    persist();updateHeader();
  },60000);
}
function initPWA(){
  try{
    const icon='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0f0f12"/><text x="32" y="44" font-size="30" text-anchor="middle" fill="#818cf8" font-family="monospace">N</text></svg>');
    const manifest={name:'NEUROLEX',short_name:'NEUROLEX',start_url:'.',display:'standalone',background_color:'#050506',theme_color:'#050506',icons:[{src:icon,sizes:'any',type:'image/svg+xml'}]};
    const link=document.createElement('link');
    link.rel='manifest';
    link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(link);
    /* Service worker инлайном через blob: Chrome такие регистрации
       отклоняет (нужен same-origin файл). Регистрация обёрнута в catch —
       деградация мягкая: приложение полностью локально и без сети
       работает и так, все данные в localStorage. */
    if('serviceWorker'in navigator){
      const SW_CACHE='neurolex-v1';
      const code=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.open('${SW_CACHE}').then(async c=>{const hit=await c.match(e.request);if(hit)return hit;try{const r=await fetch(e.request);if(e.request.method==='GET'&&r.ok)c.put(e.request,r.clone());return r;}catch(err){return Response.error();}}));});`;
      const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
      navigator.serviceWorker.register(url).catch(()=>debugLog('SW: blob-регистрация отклонена браузером'));
    }
  }catch(e){debugLog('PWA init failed',e);}
}
function boot(){
  applySettings();
  buildTabNav();
  renderLevelList();
  bindTopBar();
  bindKeys();
  trackTime();
  fatigueWatch();
  initPWA();
  updateHeader();
  updateRightPanel();
  setInterval(updateRightPanel,10000);
  if(matchMedia('(min-width:1024px)').matches)$('mainArea').style.paddingRight='336px';
  const tab=TABS.some(t=>t[0]===S.session.activeTab)?S.session.activeTab:'poetry';
  switchTab(tab);
}
boot();
</script>
