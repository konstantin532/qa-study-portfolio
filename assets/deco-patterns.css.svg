<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Исходник геометрии. В рантайме не подключается:
       фрагментные ссылки на pattern как CSS-картинку не поддерживаются.
       Рабочая форма — три класса .bg-* в конце css/08-components.css.
       Правки геометрии вносить здесь и переносить в data-URI.
       Цвет литеральный: внутри SVG-файла токен не виден. -->
  <defs>
    <pattern id="pattern-sunburst" width="80" height="80" patternUnits="userSpaceOnUse">
      <g stroke="#D4AF37" stroke-width="0.7" fill="none">
        <path d="M40 40L40 0M40 40L80 40M40 40L40 80M40 40L0 40M40 40L67 13M40 40L13 13M40 40L13 67M40 40L67 67"/>
      </g>
    </pattern>
    <pattern id="pattern-chevrons" width="80" height="40" patternUnits="userSpaceOnUse">
      <g stroke="#D4AF37" stroke-width="0.7" fill="none">
        <path d="M10 8l8 12-8 12M40 8l8 12-8 12M70 8l8 12-8 12M30 28l8 12-8 12M60 28l8 12-8 12"/>
      </g>
    </pattern>
    <pattern id="pattern-diamonds" width="80" height="80" patternUnits="userSpaceOnUse">
      <g stroke="#D4AF37" stroke-width="0.7" fill="none">
        <path d="M20 10l10 10-10 10-10-10zM60 10l10 10-10 10-10-10zM40 50l10 10-10 10-10-10z"/>
        <circle cx="40" cy="30" r="1.5"/>
        <circle cx="20" cy="50" r="1.5"/>
        <circle cx="60" cy="50" r="1.5"/>
      </g>
    </pattern>
  </defs>
</svg>